<!doctype html>
<html lang="sv">
<head>

<meta name="mobile-web-app-capable" content="yes">

<style>
html { -webkit-text-size-adjust: 100%; height: 100%; touch-action: pan-x pan-y; }
body, button, a, label, input, select, textarea { touch-action: manipulation; }
/* An app, not a document: no text selection or long-press callouts, except where you type */
html, body, * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input, textarea, [contenteditable="true"] { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
img, svg { -webkit-user-drag: none; }
body { margin: 0; min-height: 100%; overscroll-behavior-y: none; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* No Claude account in this version */
[data-act="fmode"][data-v="beskriv"], #labelfile, label[for="labelfile"] { display: none !important; }
/* Layout: iOS 26 "Liquid Glass" — ambient color field, translucent glass cards, floating capsule tab bar, glass sheets */
:root {
  --base: #eef0f6;
  --glass: rgba(255, 255, 255, 0.58);
  --glass-strong: rgba(255, 255, 255, 0.78);
  --glass-sheen: rgba(255, 255, 255, 0.55);
  --glass-edge: rgba(255, 255, 255, 0.75);
  --glass-hi: rgba(255, 255, 255, 0.9);
  --glass-shadow: 0 10px 30px rgba(30, 40, 80, 0.08), 0 1px 2px rgba(30, 40, 80, 0.06);
  --fill: rgba(118, 118, 128, 0.14);
  --fill-2: rgba(118, 118, 128, 0.22);
  --fg: #0b0b0f;
  --fg2: rgba(40, 40, 52, 0.64);
  --fg3: rgba(40, 40, 52, 0.34);
  --sep: rgba(60, 60, 67, 0.16);
  --blue: #007aff;
  --green: #34c759;
  --red: #ff3b30;
  --orange: #ff9500;
  --purple: #af52de;
  --ring: #fa114f;
  --ring-bg: rgba(250, 17, 79, 0.15);
  --gold-fg: #a15c00;
  --blob1: rgba(255, 92, 140, 0.45);
  --blob2: rgba(64, 140, 255, 0.42);
  --blob3: rgba(52, 199, 140, 0.32);
  --scrim: rgba(10, 12, 20, 0.28);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --base: #050508; --glass: rgba(44, 44, 52, 0.46); --glass-strong: rgba(36, 36, 42, 0.78); --glass-sheen: rgba(255, 255, 255, 0.08);
    --glass-edge: rgba(255, 255, 255, 0.12); --glass-hi: rgba(255, 255, 255, 0.16); --glass-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    --fill: rgba(118, 118, 128, 0.24); --fill-2: rgba(118, 118, 128, 0.36); --fg: #ffffff; --fg2: rgba(235, 235, 245, 0.62); --fg3: rgba(235, 235, 245, 0.3); --sep: rgba(255, 255, 255, 0.1);
    --blue: #0a84ff; --green: #30d158; --red: #ff453a; --orange: #ff9f0a; --purple: #bf5af2; --ring-bg: rgba(250, 17, 79, 0.24); --gold-fg: #ff9f0a;
    --blob1: rgba(255, 55, 110, 0.32); --blob2: rgba(40, 110, 255, 0.34); --blob3: rgba(40, 200, 140, 0.2); --scrim: rgba(0, 0, 0, 0.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --base: #050508; --glass: rgba(44, 44, 52, 0.46); --glass-strong: rgba(36, 36, 42, 0.78); --glass-sheen: rgba(255, 255, 255, 0.08);
  --glass-edge: rgba(255, 255, 255, 0.12); --glass-hi: rgba(255, 255, 255, 0.16); --glass-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  --fill: rgba(118, 118, 128, 0.24); --fill-2: rgba(118, 118, 128, 0.36); --fg: #ffffff; --fg2: rgba(235, 235, 245, 0.62); --fg3: rgba(235, 235, 245, 0.3); --sep: rgba(255, 255, 255, 0.1);
  --blue: #0a84ff; --green: #30d158; --red: #ff453a; --orange: #ff9f0a; --purple: #bf5af2; --ring-bg: rgba(250, 17, 79, 0.24); --gold-fg: #ff9f0a;
  --blob1: rgba(255, 55, 110, 0.32); --blob2: rgba(40, 110, 255, 0.34); --blob3: rgba(40, 200, 140, 0.2); --scrim: rgba(0, 0, 0, 0.5); color-scheme: dark;
}
html, body { background: var(--base); color: var(--fg); }
body { font-family: var(--font); font-size: 17px; line-height: 1.35; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.press { transition: transform 160ms cubic-bezier(0.3, 0.7, 0.4, 1.4), opacity 120ms ease-out; }
.press:active { transform: scale(0.96); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Ambient light field that the glass refracts */
.ambient { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.ambient i { position: absolute; border-radius: 50%; filter: blur(70px); }
.ambient i:nth-child(1) { width: 70vmax; height: 70vmax; left: -25vmax; top: -30vmax; background: var(--blob1); }
.ambient i:nth-child(2) { width: 65vmax; height: 65vmax; right: -30vmax; top: 15vh; background: var(--blob2); }
.ambient i:nth-child(3) { width: 60vmax; height: 60vmax; left: -10vmax; bottom: -35vmax; background: var(--blob3); }

/* Glass material */
.glass, .card, .list, .tile, .tabbar, .coachbtn, .wbar, .timer, .toast, .sheet, .seg, .select, .bubble.ai, .composer, .minibar {
  background: linear-gradient(160deg, var(--glass-sheen), transparent 42%), var(--glass);
  -webkit-backdrop-filter: blur(26px) saturate(185%); backdrop-filter: blur(26px) saturate(185%);
  border: 0.5px solid var(--glass-edge);
  box-shadow: inset 0 1px 0 var(--glass-hi), var(--glass-shadow);
}

.app { max-width: 34rem; margin-inline: auto; padding-top: env(safe-area-inset-top, 0px) !important; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px calc(176px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 22px; }
.head { display: flex; flex-direction: column; gap: 2px; padding-top: 18px; }
.head-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.eyebrow { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; color: var(--fg2); }
.large { font-size: 34px; line-height: 1.12; font-weight: 700; letter-spacing: -0.022em; margin: 0; text-wrap: balance; }
input.large { border: 0; background: transparent; color: var(--fg); font-family: var(--font); width: 100%; padding: 0 4px; margin-left: -4px; border-radius: 10px; }
input.large:focus { background: var(--fill); outline: none; }
.section { display: flex; flex-direction: column; gap: 8px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-inline: 4px; }
.sec-title { font-size: 22px; font-weight: 700; letter-spacing: -0.012em; margin: 0; }
.sec-note { font-size: 13px; color: var(--fg2); padding-inline: 4px; margin: 0; }
.grp { font-size: 13px; font-weight: 600; color: var(--fg2); text-transform: uppercase; letter-spacing: 0.02em; padding: 0 4px; margin: 0; }
.card { border-radius: 24px; }
.pad { padding: 16px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.muted { color: var(--fg2); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }

/* Ring card */
.ringcard { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; padding: 18px; }
.ring { width: 96px; height: 96px; }
.ring circle { fill: none; stroke-width: 13; stroke-linecap: round; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; min-width: 0; }
.stat .k { font-size: 13px; color: var(--fg2); }
.stat .v { font-family: var(--round); font-size: 22px; font-weight: 700; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 14px; font-weight: 600; color: var(--fg2); margin-left: 2px; }
.stat .v.red { color: var(--ring); }

/* Today card */
.today { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.today .top { display: flex; align-items: center; gap: 12px; }
.dot { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; color: #fff; flex: none; font-weight: 700; font-size: 15px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 2px 6px rgba(0, 0, 0, 0.12); }
.dot svg { width: 20px; height: 20px; }
.today .name { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; padding: 5px 11px; border-radius: 99px; background: var(--fill); color: var(--fg2); white-space: nowrap; }

/* Tiles */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { text-align: left; padding: 14px; border-radius: 22px; display: flex; flex-direction: column; gap: 10px; min-height: 112px; position: relative; }
.tile .t { font-size: 17px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .s { font-size: 13px; color: var(--fg2); margin-top: -8px; }
.tile .badge { position: absolute; top: 12px; right: 12px; font-size: 11px; font-weight: 600; color: var(--blue); background: color-mix(in srgb, var(--blue) 14%, transparent); padding: 3px 8px; border-radius: 99px; }

/* Grouped list */
.list { border-radius: 22px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 16px; min-height: 50px; width: 100%; text-align: left; position: relative; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 16px; height: 0.5px; background: var(--sep); }
.row .main { flex: 1; min-width: 0; }
.row .title { display: block; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub { display: block; font-size: 13px; color: var(--fg2); }
.row .end { color: var(--fg2); font-size: 15px; text-align: right; font-variant-numeric: tabular-nums; flex: none; }
.row .dot { width: 32px; height: 32px; border-radius: 10px; font-size: 13px; }
.chev { width: 8px; height: 13px; color: var(--fg3); flex: none; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 99px; white-space: nowrap; }
.pill.gold { color: var(--gold-fg); background: rgba(255, 159, 10, 0.18); }

/* Buttons & controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 52px; padding: 0 22px; border-radius: 999px; font-size: 17px; font-weight: 600; width: 100%; }
.btn.primary { background: linear-gradient(180deg, rgba(255, 255, 255, 0.22), transparent 55%), var(--blue); color: #fff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 6px 18px color-mix(in srgb, var(--blue) 35%, transparent); }
.btn.green { background: linear-gradient(180deg, rgba(255, 255, 255, 0.22), transparent 55%), var(--green); color: #fff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 6px 18px color-mix(in srgb, var(--green) 35%, transparent); }
.btn.tinted { background: color-mix(in srgb, var(--blue) 14%, var(--glass)); color: var(--blue); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); box-shadow: inset 0 1px 0 var(--glass-hi); border: 0.5px solid var(--glass-edge); }
.btn.danger { background: color-mix(in srgb, var(--red) 13%, transparent); color: var(--red); }
.btn.sm { height: 42px; font-size: 15px; width: auto; padding: 0 16px; }
.btns { display: grid; grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); gap: 10px; }
.link { color: var(--blue); font-size: 17px; }
.link.red { color: var(--red); }
.link.bold { font-weight: 600; }
.link.sm { font-size: 15px; }
.stepper { display: inline-flex; background: var(--fill); border-radius: 99px; overflow: hidden; flex: none; }
.stepper button { width: 42px; height: 32px; font-size: 20px; display: grid; place-items: center; }
.stepper button + button { border-left: 0.5px solid var(--sep); }
.seg { display: flex; border-radius: 99px; padding: 3px; gap: 2px; overflow-x: auto; }
.seg button { flex: 1 0 auto; padding: 7px 12px; border-radius: 99px; font-size: 13px; font-weight: 600; white-space: nowrap; color: var(--fg2); }
.seg button[aria-pressed="true"] { background: var(--glass-strong); color: var(--fg); box-shadow: inset 0 1px 0 var(--glass-hi), 0 2px 8px rgba(0, 0, 0, 0.1); }
.inp { width: 100%; max-width: 5rem; height: 36px; border: 0; border-radius: 12px; background: var(--fill); color: var(--fg); text-align: center; font: 600 17px var(--font); font-variant-numeric: tabular-nums; }
.inp::placeholder { color: var(--fg3); font-weight: 500; }
.field { width: 100%; height: 44px; border: 0; border-radius: 14px; background: var(--fill); color: var(--fg); font: 17px var(--font); padding: 0 14px; }
textarea.field { height: auto; min-height: 72px; padding: 10px 14px; resize: vertical; line-height: 1.4; }
.select { width: 100%; height: 46px; border-radius: 99px; color: var(--fg); font: 17px var(--font); padding: 0 16px; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr)); gap: 10px; align-items: end; }
.form label { font-size: 12px; color: var(--fg2); display: flex; flex-direction: column; gap: 4px; }
.form .inp { max-width: none; height: 42px; }
.swatches { display: flex; gap: 12px; flex-wrap: wrap; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.5); }
.sw[aria-pressed="true"] { border-color: var(--fg); }

/* Active workout */
.wbar { position: sticky; top: calc(8px + env(safe-area-inset-top, 0px)); z-index: 20; border-radius: 99px; padding: 10px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.wbar .clock { font-family: var(--round); font-weight: 600; font-variant-numeric: tabular-nums; font-size: 17px; }
.ex { padding: 14px 0 8px; overflow: hidden; }
.ex-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 0 16px 6px; }
.ex-name { font-size: 17px; font-weight: 600; color: var(--blue); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.ex-sub { font-size: 13px; color: var(--fg2); display: block; }
.ex-note { margin: 0 16px 8px; font-size: 14px; color: var(--fg2); background: var(--fill); border-radius: 12px; padding: 7px 12px; }
.ex-menu { display: flex; flex-wrap: wrap; gap: 8px 16px; padding: 0 16px 10px; }
.ex-menu textarea { flex-basis: 100%; }
.sets { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.sets th { font-size: 12px; font-weight: 600; color: var(--fg2); text-transform: uppercase; letter-spacing: 0.02em; padding: 4px; text-align: center; }
.sets td { padding: 4px; text-align: center; }
.sets td:first-child, .sets th:first-child { padding-left: 12px; width: 2.6rem; }
.sets td:last-child, .sets th:last-child { padding-right: 16px; width: 3.2rem; }
.sets tr.done td { background: color-mix(in srgb, var(--green) 13%, transparent); }
.setno { font-weight: 700; color: var(--fg2); min-width: 30px; height: 30px; border-radius: 10px; }
.setno.t-w { color: var(--orange); }
.setno.t-d { color: var(--purple); }
.setno.t-f { color: var(--red); }
.prev { color: var(--fg3); font-size: 15px; white-space: nowrap; }
.chk { width: 34px; height: 34px; border-radius: 12px; background: var(--fill); display: inline-grid; place-items: center; color: transparent; transition: background 150ms ease-out, transform 160ms cubic-bezier(0.3, 0.7, 0.4, 1.5); }
.chk:active { transform: scale(0.88); }
.chk svg { width: 16px; height: 16px; }
tr.done .chk { background: var(--green); color: #fff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45); }
.addset { display: block; margin: 8px 16px 6px; width: calc(100% - 32px); height: 36px; border-radius: 99px; background: var(--fill); font-size: 15px; font-weight: 600; }
.legend { font-size: 12px; color: var(--fg2); text-align: center; }
.legend b { font-weight: 700; }

/* Floating tab bar + coach button */
.dock { position: fixed; z-index: 40; left: 0; right: 0; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.dock .in { max-width: 34rem; margin-inline: auto; display: flex; gap: 10px; align-items: center; }
.tabbar { pointer-events: auto; flex: 1; min-width: 0; border-radius: 999px; padding: 5px; display: grid; grid-template-columns: repeat(5, 1fr); position: relative; }
.tab-ind { position: absolute; top: 5px; bottom: 5px; left: 0; width: 0; border-radius: 999px; z-index: 0; pointer-events: none; background: linear-gradient(160deg, var(--glass-hi), transparent 55%), var(--fill-2); box-shadow: inset 0 1px 0 var(--glass-hi), inset 0 -1px 0 rgba(0, 0, 0, 0.06), 0 2px 10px rgba(0, 0, 0, 0.12); -webkit-backdrop-filter: blur(6px) saturate(200%); backdrop-filter: blur(6px) saturate(200%); will-change: transform, width; }
.tab { position: relative; z-index: 1; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 10px; font-weight: 600; color: var(--fg2); padding: 6px 0 5px; border-radius: 999px; transition: background 220ms ease, color 220ms ease; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--blue); }
.coachbtn { pointer-events: auto; width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; flex: none; color: var(--fg); }
.coachbtn svg { width: 28px; height: 28px; }
.coachbtn .spark { fill: url(#sparkg); }

/* Rest timer */
.timer { position: fixed; z-index: 45; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(23rem, calc(100% - 28px)); border-radius: 999px; padding: 10px 10px 10px 22px; display: flex; align-items: center; gap: 6px; }
.timer .lbl { font-size: 11px; color: var(--fg2); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
.timer .time { font-family: var(--round); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; line-height: 1.1; }
.timer .grow { flex: 1; min-width: 0; }
.timer .prog { height: 3px; border-radius: 2px; background: var(--fill); margin-top: 3px; overflow: hidden; max-width: 7rem; }
.timer .prog i { display: block; height: 100%; background: var(--orange); width: 0; }
.timer .tb { height: 40px; min-width: 44px; padding: 0 10px; border-radius: 99px; background: var(--fill); font-size: 15px; font-weight: 600; }
.timer.finished .time { color: var(--green); }

/* Sheets */
.scrim { position: fixed; inset: 0; z-index: 60; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity 280ms ease; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; z-index: 61; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); margin-inline: auto; max-width: 34rem; max-height: 88%; border-radius: 34px; display: flex; flex-direction: column; transform: translateY(calc(100% + 60px + env(safe-area-inset-bottom, 0px))); visibility: hidden; transition: transform 420ms cubic-bezier(0.32, 0.72, 0, 1), visibility 0s linear 420ms; background: linear-gradient(160deg, var(--glass-sheen), transparent 40%), var(--glass-strong); }
.sheet.on { transform: translateY(0); visibility: visible; transition: transform 420ms cubic-bezier(0.32, 0.72, 0, 1), visibility 0s; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: color-mix(in srgb, var(--base) 55%, transparent); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); pointer-events: none; }
.grab { width: 36px; height: 5px; border-radius: 3px; background: var(--fg3); margin: 8px auto 0; flex: none; }
#sheet-inner { display: flex; flex-direction: column; min-height: 0; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px 8px; gap: 12px; flex: none; }
.sheet-head h2 { font-size: 17px; font-weight: 600; margin: 0; text-align: center; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-head > :first-child, .sheet-head > :last-child { min-width: 4.5rem; }
.sheet-head > :last-child { text-align: right; }
.sheet-body { overflow-y: auto; padding: 6px 16px 22px; display: flex; flex-direction: column; gap: 18px; }
.sheet .card, .sheet .list { background: var(--fill); -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: none; border-color: transparent; }
.search { width: 100%; height: 40px; border-radius: 99px; border: 0; background: var(--fill); color: var(--fg); font: 17px var(--font); padding: 0 16px; }
.big-num { font-family: var(--round); font-size: 44px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1; }
.big-num small { font-size: 20px; color: var(--fg2); font-weight: 600; margin-left: 4px; }

/* ---------- Charts ---------- */
function lineChart(pts, unit, color) {
  if (pts.length < 2) return `<p class="sec-note" style="padding:8px 0 0">Logga minst två gånger för att se en kurva.</p>`;
  const W = 340, H = 170, L = 38, Rr = 12, T = 12, B = 24;
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const padY = Math.max(1, (y1 - y0) * 0.15); y0 -= padY; y1 += padY;
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const X = x => L + (x1 === x0 ? 0.5 : (x - x0) / (x1 - x0)) * (W - L - Rr);
  const Y = y => T + (1 - (y - y0) / (y1 - y0)) * (H - T - B);
  const ticks = [0, 0.5, 1].map(f => y0 + f * (y1 - y0));
  const line = pts.map((p, i) => (i ? 'L' : 'M') + X(p.x).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
  const area = line + ` L${X(x1).toFixed(1)} ${H - B} L${X(x0).toFixed(1)} ${H - B} Z`;
  const last = pts[pts.length - 1]; const id = 'g' + uid();
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Utveckling i ${unit}">
    <defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:${color};stop-opacity:.3"/><stop offset="1" style="stop-color:${color};stop-opacity:0"/></linearGradient></defs>
    ${ticks.map(t => `<line x1="${L}" x2="${W - Rr}" y1="${Y(t)}" y2="${Y(t)}" style="stroke:var(--sep)" stroke-width="1"/><text x="${L - 6}" y="${Y(t) + 4}" text-anchor="end">${fmt(t)}</text>`).join('')}
    <path d="${area}" fill="url(#${id})"/>
    <path d="${line}" fill="none" style="stroke:${color}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${X(last.x)}" cy="${Y(last.y)}" r="5" style="fill:${color};stroke:var(--base)" stroke-width="2.5"/>
    <text x="${L}" y="${H - 6}">${esc(dateShort(x0))}</text><text x="${W - Rr}" y="${H - 6}" text-anchor="end">${esc(dateShort(x1))}</text>
  </svg>`;
}
function barChart(bars) {
  const W = 340, H = 150, L = 8, Rr = 8, T = 18, B = 22; const max = Math.max(1, ...bars.map(b => b.v));
  const bw = (W - L - Rr) / bars.length;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Volym per vecka">${bars.map((b, i) => { const h = (b.v / max) * (H - T - B); const x = L + i * bw + bw * 0.18, w = bw * 0.64; return `<rect x="${x}" y="${H - B - h}" width="${w}" height="${Math.max(h, b.v ? 2 : 0)}" rx="5" style="fill:${i === bars.length - 1 ? 'var(--blue)' : 'var(--fg3)'}"/>${b.v ? `<text x="${x + w / 2}" y="${H - B - h - 5}" text-anchor="middle">${b.v >= 1000 ? fmt(b.v / 1000, 1) + 'k' : fmt(b.v)}</text>` : ''}<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle">v${b.w}</text>`; }).join('')}<line x1="${L}" x2="${W - Rr}" y1="${H - B}" y2="${H - B}" style="stroke:var(--sep)"/></svg>`;
}
function isoWeek(t) { const d = new Date(t); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7); const w1 = new Date(d.getFullYear(), 0, 4); return 1 + Math.round(((d - w1) / 86400000 - 3 + (w1.getDay() + 6) % 7) / 7); }
function weekBars() { const wk = weekStart(Date.now()); return Array.from({ length: 8 }, (_, i) => { const s = wk - (7 - i) * 7 * 86400000; const e = s + 7 * 86400000; const ws = S.workouts.filter(w => w.start >= s && w.start < e); return { w: isoWeek(s), v: Math.round(ws.reduce((a, w) => a + wStats(w).vol, 0)), n: ws.length }; }); }

/* ---------- Active / edit workout ---------- */
function parseRange(t) { const m = String(t || '').match(/(\d+)\s*[-–]\s*(\d+)/); if (m) return [+m[1], +m[2]]; const n = parseInt(t, 10); return n > 0 ? [n, n] : [8, 12]; }

function ssLetter(ex, i) { let g = 0; for (let j = 0; j <= i; j++) { const start = !(j > 0 && ex[j - 1].ss) && (ex[j].ss && j < ex.length - 1); if (start) g++; } return String.fromCharCode(64 + Math.max(1, g)); }

/* ================= Favourites, recents and saved meals ================= */
const foodKey = n => String(n || '').trim().toLowerCase();
const favs = () => Array.isArray(S.settings.favFoods) ? S.settings.favFoods : [];
const isFav = n => favs().some(f => foodKey(f.name) === foodKey(n));
const meals = () => Array.isArray(S.settings.meals) ? S.settings.meals : [];
function recentFoods(limit = 12) {
  const m = new Map(); const today = dayKey(Date.now());
  Object.keys(S.food).sort().reverse().slice(0, 30).forEach(d => (S.food[d] || []).forEach(e => {
    const k = foodKey(e.name); const cur = m.get(k) || { name: e.name, per100: e.per100, g: e.g, n: 0, last: '' };
    cur.n++; if (d > cur.last) { cur.last = d; cur.g = e.g; cur.per100 = e.per100; } m.set(k, cur);
  }));
  const age = d => Math.round((fromKey(today) - fromKey(d)) / 86400000);
  return [...m.values()].filter(x => !isFav(x.name)).sort((a, b) => (b.n + (age(b.last) <= 2 ? 3 : 0)) - (a.n + (age(a.last) <= 2 ? 3 : 0))).slice(0, limit);
}
function quickItems() { return favs().map(f => Object.assign({ fav: true }, f)).concat(recentFoods(10)).slice(0, 12); }
function mealKcal(m) { return m.items.reduce((a, i) => a + nutrFor(i.per100, i.g).kcal, 0); }
function quickLog(item, meal) {

  S.food[day] = (S.food[day] || []).concat([entry]); store.saveFoodDay(day);
  S.undo = { day, ids: [entry.id] }; toast(`${item.name} ${fmt(entry.g)} g tillagd · tryck för att ångra`, true);
}
function logMeal(m, meal) {
  const day = fday(); const list = m.items.map(i => ({ id: uid(), meal: meal || 'Allmänt', name: i.name, g: num(i.g), per100: i.per100, src: 'maltid' }));
  S.food[day] = (S.food[day] || []).concat(list); store.saveFoodDay(day);
  S.undo = { day, ids: list.map(x => x.id) }; toast(`${m.name} loggad · tryck för att ångra`, true);
}

    case 'edithist': { if (guardActive()) break; const w = S.workouts.find(x => x.id === v); if (!w) break; closeSheet(); S.active = editFrom(w); S.inWorkout = true; S.exMenu = -1; S.confirmCancel = false; render(); window.scrollTo(0, 0); break; }
    case 'repeat': {
      if (guardActive()) break; const w = S.workouts.find(x => x.id === v); if (!w) break; closeSheet();
      begin({ start: Date.now(), name: w.name, tpl: w.tpl, exercises: clone(w.exercises || []).map(e => ({ name: e.name, kind: e.kind, note: e.note, ss: e.ss, sets: e.sets.map(s => { const o = {}; ['kg', 'reps', 'min', 'km'].forEach(f => { if (s[f] !== undefined) o[f] = String(s[f]).replace('.', ','); }); if (s.t) o.t = s.t; return o; }) })) });
      toast('Samma vikter som sist är ifyllda'); break;
    }
    case 'delhist': d.confirm = true; renderSheet(); break;
    case 'delhistno': d.confirm = false; renderSheet(); break;
    case 'delhistyes': store.deleteWorkout(v); closeSheet(); render(); toast('Passet togs bort'); break;
    case 'close': closeSheet(); break;
    /* progress */
    case 'progpick': S.progEx = v; render(); window.scrollTo({ top: 0 }); break;
    case 'delgoal': S.settings.goals.splice(+v, 1); store.saveSettings(); render(); break;
    /* body */
    case 'measure': S.measure = v; render(); break;
    case 'bodyedit': { S.bodyEdit = v; render(); const f = $('#bform'); if (f) f.scrollIntoView({ block: 'center' }); break; }
    case 'bodycancel': S.bodyEdit = null; render(); break;
    case 'delbody': S.body.entries = S.body.entries.filter(e => e.d !== v); if (S.bodyEdit === v) S.bodyEdit = null; store.saveBody(); render(); toast('Mätningen togs bort'); break;
  }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'coachin') { S.coachDraft = t.value; autosize(); const btn = $('#composer .send'); if (btn && !S.coachBusy) btn.disabled = !t.value.trim() || S.coachState === 'off'; return; }
  if (t.dataset.f && S.active) { const s = S.active.exercises[+t.dataset.ei].sets[+t.dataset.si]; s[t.dataset.f] = t.value.replace(/[^0-9.,]/g, ''); store.saveActive(); if (t.dataset.f === 'kg') { const r = t.closest('tr') && t.closest('tr').nextElementSibling; if (r && r.classList.contains('platerow')) r.firstElementChild.innerHTML = plateRowHTML(t.value || t.placeholder); } return; }
  if (t.dataset.note !== undefined && S.active) { S.active.exercises[+t.dataset.note].note = t.value.slice(0, 200); store.saveActive(); return; }
  if (t.id === 'wname' && S.active) { S.active.name = t.value; store.saveActive(); return; }
  if (t.id === 'wcomment' && S.active) { S.active.comment = t.value.slice(0, 500); store.saveActive(); return; }
  if (S.active && S.active.edit && ['ed-date', 'ed-time', 'ed-mins'].includes(t.id)) { S.active.edit[{ 'ed-date': 'date', 'ed-time': 'time', 'ed-mins': 'mins' }[t.id]] = t.value; return; }
  if (t.id === 'foodq' && S.sheet) { S.sheet.data.q = t.value; const pos = t.selectionStart; renderSheet(); const q = $('#foodq'); q.focus(); try { q.setSelectionRange(pos, pos); } catch (e) { /* ignore */ } return; }
  if (t.id === 'amtg' && S.sheet) { S.sheet.data.g = t.value.replace(/[^0-9.,]/g, ''); const pv = $('#amtprev'); if (pv) pv.innerHTML = amountPreview(nutrFor(S.sheet.data.item.per100, S.sheet.data.g)); return; }
  if (t.id === 'mealname' && S.sheet) { S.sheet.data.meal.name = t.value; return; }
  if (t.dataset.mi !== undefined && S.sheet) { S.sheet.data.meal.items[+t.dataset.mi].g = t.value.replace(/[^0-9.,]/g, ''); return; }
  if (t.id === 'coachq' && S.sheet) { S.sheet.data.q = t.value; return; }
  if (t.id === 'describe' && S.sheet) { S.sheet.data.desc = t.value; return; }
  if (t.dataset.res !== undefined && S.sheet) { S.sheet.data.results[+t.dataset.res].g = t.value.replace(/[^0-9.,]/g, ''); return; }
  if (t.dataset.pf && S.sheet) { S.sheet.data.product[t.dataset.pf] = t.value; return; }
  if (t.dataset.pn && S.sheet) { S.sheet.data.product.per100[t.dataset.pn] = t.value.replace(/[^0-9.,]/g, ''); return; }
  if (t.id === 'dayname' && S.sheet) { S.sheet.data.day.name = t.value; return; }
  if (t.dataset.dex !== undefined && S.sheet) { S.sheet.data.day.ex[+t.dataset.dex][t.dataset.df] = t.value; return; }
  if (t.id === 'pickq') { S.sheet.data.q = t.value; const pos = t.selectionStart; renderSheet(); const q = $('#pickq'); q.focus(); try { q.setSelectionRange(pos, pos); } catch (e) { /* ignore */ } return; }
  if (t.id === 'plateKg' || t.id === 'barKg') {
    const total = num($('#plateKg').value), bar = num($('#barKg').value) || 20, out = $('#plateOut');
    if (total <= bar) { out.textContent = total ? 'Vikten måste vara mer än stången.' : 'Skriv en vikt så visas skivorna per sida.'; return; }
    let side = (total - bar) / 2; const plates = [[25, '#ff3b30'], [20, '#007aff'], [15, '#ffcc00'], [10, '#34c759'], [5, '#8e8e93'], [2.5, '#636366'], [1.25, '#48484a']]; const use = [];
    plates.forEach(([p, c]) => { while (side >= p - 1e-9) { use.push([p, c]); side -= p; } });
    out.innerHTML = `<div style="margin-bottom:6px">Per sida:</div><div class="plates">${use.map(([p, c]) => `<span class="plate" style="background:${c};${p === 15 ? 'color:#000' : ''}">${fmt(p, 2)}</span>`).join('')}</div>${side > 0.01 ? `<div style="margin-top:6px">${fmt(side * 2, 2)} kg går inte att lägga exakt.</div>` : ''}`;
  }
  if (t.id === 'rmKg' || t.id === 'rmReps') {
    const kg = num($('#rmKg').value), r = Math.round(num($('#rmReps').value)), out = $('#rmOut');
    if (!kg || !r) { out.textContent = 'Fyll i ett set du klarat.'; return; }
    const rm = e1rm(kg, r); const pct = [[95, 2], [90, 4], [85, 6], [80, 8], [75, 10], [70, 12]];
    out.innerHTML = `<div class="big-num num" style="font-size:34px;color:var(--fg)">${fmtKg(rm)}<small>kg</small></div><div class="list" style="margin-top:10px">${pct.map(([p, rr]) => `<div class="row" style="min-height:40px;padding-block:8px"><span class="main">${p} % · ca ${rr} reps</span><span class="end num">${fmtKg(rm * p / 100)} kg</span></div>`).join('')}</div>`;
  }
  if (t.id === 'wuKg' || t.id === 'wuBar') {
    const kg = num($('#wuKg').value), bar = num($('#wuBar').value) || 20, out = $('#wuOut');
    if (kg <= bar) { out.textContent = kg ? 'Arbetsvikten måste vara mer än stången.' : 'Skriv vikten du ska köra så får du uppvärmningsset.'; return; }
    const r25 = x => Math.max(bar, Math.round(x / 2.5) * 2.5);
    const steps = [[bar, 10, 'Tom stång'], [r25(kg * 0.45), 5, '45 %'], [r25(kg * 0.65), 3, '65 %'], [r25(kg * 0.85), 1, '85 %']].filter((s, i, arr) => i === 0 || s[0] > arr[i - 1][0]);
    out.innerHTML = `<div class="list">${steps.map(([w, r, l]) => `<div class="row" style="min-height:40px;padding-block:8px"><span class="main">${l}</span><span class="end num" style="color:var(--fg);font-weight:600">${fmtKg(w)} kg × ${r}</span></div>`).join('')}<div class="row" style="min-height:40px;padding-block:8px"><span class="main"><b>Arbetsset</b></span><span class="end num" style="color:var(--blue);font-weight:600">${fmtKg(kg)} kg</span></div></div>`;
  }
});
function showPlateRow(inp) {
  document.querySelectorAll('tr.platerow').forEach(r => r.remove());
  if (!inp || inp.dataset.f !== 'kg' || !S.active) return; const e = S.active.exercises[+inp.dataset.ei]; if (!e || e.kind !== 'vikt') return;
  const tr = inp.closest('tr'); if (!tr) return; const row = document.createElement('tr'); row.className = 'platerow';
  const val = inp.value || inp.placeholder; row.innerHTML = `<td colspan="5">${plateRowHTML(val)}</td>`; tr.after(row);
}
document.addEventListener('focusin', ev => { const t = ev.target; if (t.dataset && t.dataset.f === 'kg') showPlateRow(t); });
document.addEventListener('focusout', ev => { const t = ev.target; if (t.dataset && t.dataset.f === 'kg') setTimeout(() => { const a = document.activeElement; if (!a || a.dataset.f !== 'kg') showPlateRow(null); }, 0); });
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && S.sheet) closeSheet();
  if (ev.target.id === 'coachin' && ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); coachSend(S.coachDraft); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'progsel') { S.progEx = t.value; render(); return; }
  if (t.id === 'importfile' && t.files && t.files[0]) {
    t.files[0].text().then(txt => { const d = JSON.parse(txt); if (!d || d.app !== 'traningsloggen') throw new Error('fel fil');
      S.workouts = d.workouts || []; S.settings = Object.assign(S.settings, d.settings || {}); if (d.program) S.program = d.program; S.body = d.body || { entries: [] }; S.food = d.food || {}; S.foods = d.foods || [];
      store.persistLocal(); render(); toast('Backupen är inläst'); }).catch(() => toast('Filen kunde inte läsas'));
    t.value = ''; return;
  }
  if ((t.id === 'fmealsel' || t.id === 'amtmealsel' || t.id === 'scanmeal') && S.sheet) { S.sheet.data.meal = t.value; return; }
  const file = t.files && t.files[0]; if (!file || !S.sheet) return;
  if (t.id === 'scanfile') handleScan(file);
  else if (t.id === 'labelfile') handleLabel(file);
  else if (t.id === 'mealfile') { S.sheet.data.mealImg = file; renderSheet(); }
});
document.addEventListener('submit', ev => {
  ev.preventDefault();
  if (ev.target.id === 'composer') { coachSend(S.coachDraft); return; }
  if (ev.target.id === 'bform') {
    const d = $('#bdate').value; if (!d) return;
    const entry = { d }; let any = false;
    MEASURES.forEach(([k]) => { const v = num($('#b-' + k).value); if (v > 0) { entry[k] = Math.round(v * 10) / 10; any = true; } });
    if (!any) { toast('Fyll i minst ett mått'); return; }
    if (entry.kg && (entry.kg < 20 || entry.kg > 400)) { toast('Skriv en vikt mellan 20 och 400 kg'); return; }
    S.body.entries = S.body.entries.filter(e => e.d !== d && e.d !== S.bodyEdit).concat([entry]);
    S.bodyEdit = null; store.saveBody(); render(); toast('Mätningen är sparad');
  }
  if (ev.target.id === 'codeform') { lookupCode($('#codein').value, S.sheet && S.sheet.data ? S.sheet.data.meal : 'Allmänt'); return; }
  if (ev.target.id === 'foodgoals') {
    const g = {}; [['kcal', 800, 8000], ['prot', 0, 500], ['kolh', 0, 1000], ['fett', 0, 400]].forEach(([k, lo, hi]) => { g[k] = Math.round(Math.min(hi, Math.max(lo, num($('#fg-' + k).value)))); });
    S.settings.food = g; store.saveSettings(); render(); toast('Dagsmålen är sparade'); return;
  }
  if (ev.target.id === 'goalform') {
    const name = $('#goalex').value, kg = num($('#goalkg').value); if (!name || kg <= 0) { toast('Skriv ett mål i kg'); return; }
    S.settings.goals = (S.settings.goals || []).filter(g => g.name !== name).concat([{ name, kg }]); store.saveSettings(); render(); toast('Målet är sparat');
  }
});
$('#scrim').addEventListener('click', closeSheet);

// No pinch or double-tap zoom: the app is laid out for the phone's width
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
let lastTouchEnd = 0; document.addEventListener('touchend', e => { const now = Date.now(); if (now - lastTouchEnd < 320 && !e.target.closest('input, textarea, select')) e.preventDefault(); lastTouchEnd = now; }, { passive: false });
document.addEventListener('selectstart', e => { if (!e.target.closest || !e.target.closest('input, textarea')) e.preventDefault(); });
ghHandleReturn();
S.health = lsGet('gh-health');
renderTabs();
store.init();
setTimeout(() => { if (S.ghSyncNow || (ghToken() && (!S.health || Date.now() - S.health.at > 15 * 60000))) { S.ghSyncNow = false; ghSync(true); } else if (S.ghMsg) render(); }, 300);
document.addEventListener('visibilitychange', () => { if (!document.hidden && ghToken() && S.health && Date.now() - S.health.at > 30 * 60000) ghSync(true); });
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => { reg.update(); document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update(); }); }).catch(() => {});
  let reloaded = false; navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloaded || S.active) return; reloaded = true; location.reload(); });
}
})();
</script>
